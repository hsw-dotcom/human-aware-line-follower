name: Offline reconstruction tests
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests (no camera, Arduino or Raspberry Pi)
        run: python3 -B -m unittest discover -s tests -v
      - name: Historical-control demonstration
        run: python3 -B simulation/trace.py
      - name: Compile-only checks
        run: python3 -m py_compile raspberry_pi/main.py raspberry_pi/count_objects.py
