; RECONSTRUCTION: none of these machine-specific values is from original config.
[serial]
port = /dev/ttyACM0
baudrate = 9600
timeout_seconds = 0.2

[camera]
width = 640
height = 480
snapshot_path = runtime/before.jpg

[control]
; Historic experiments: ~1-3 seconds; 2 is an unverified reference value.
restart_ignore_seconds = 2.0
; Historic design: camera evaluation near marker/while latched stopped.
detect_always = false
; Performance/reliability enhancements (NOT historical code).
minimum_capture_interval_seconds = 0.5
stop_while_inflight = true
